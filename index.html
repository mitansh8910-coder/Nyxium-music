<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nyxium Music Dashboard</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1a0033, #000000);
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
      cursor: none; /* hide default cursor */
    }

    h1 {
      font-size: 3em;
      margin-top: 80px;
      text-shadow: 0 0 20px #a64dff, 0 0 40px #ff66cc;
    }

    #animated-message {
      margin-top: 20px;
      font-size: 1.5em;
      color: #ff66cc;
      text-shadow: 0 0 10px #a64dff;
    }

    /* Starfield background */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: moveStars 60s linear infinite;
      z-index: -1;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: 10000px 10000px; }
    }

    /* Cursor star */
    #cursor-star {
      position: fixed;
      width: 15px;
      height: 15px;
      background: radial-gradient(circle, #00f 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
    }

    /* Particle trail */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.8;
      transform: translate(-50%, -50%);
      animation: fadeOut 1s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <h1>🌌 Nyxium Music Dashboard</h1>
  <p id="animated-message"></p>

  <!-- Custom cursor -->
  <div id="cursor-star"></div>

  <script>
    // Typing animation for welcome message
    function typeMessage(elementId, text, speed=50) {
      let i = 0;
      function typing() {
        if (i < text.length) {
          document.getElementById(elementId).innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, speed);
        }
      }
      typing();
    }

    window.onload = () => {
      typeMessage("animated-message", "Welcome to Nyxium Music Dashboard 🌌");
    };

    // Cursor + particle trail
    const cursor = document.getElementById('cursor-star');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.pageX + 'px';
      cursor.style.top = e.pageY + 'px';

      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = e.pageX + 'px';
      particle.style.top = e.pageY + 'px';

      const colors = ['#00f', '#a64dff', '#fff'];
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];

      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 1000);
    });
  </script>
</body>
</html>
