<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nyxium Music Dashboard</title>
  <style>
    body {
      background: radial-gradient(circle at top, #1a0033, #000000);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 3em;
      text-shadow: 0 0 20px #a64dff, 0 0 40px #ff66cc;
    }
    #animated-message {
      margin-top: 20px;
      font-size: 1.5em;
      color: #ff66cc;
      text-shadow: 0 0 10px #a64dff;
    }
  </style>
</head>
<body>
  <h1>🌌 Nyxium Music Dashboard</h1>

  <!-- This is where your animated message will appear -->
  <p id="animated-message"></p>

  <!-- Script goes at the bottom of body -->
  <script>
    function typeMessage(elementId, text, speed=50) {
      let i = 0;
      function typing() {
        if (i < text.length) {
          document.getElementById(elementId).innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, speed);
        }
      }
      typing();
    }

    window.onload = () => {
      typeMessage("animated-message", "Welcome to Nyxium Music Dashboard 🌌");
    };
  </script>
</body>
</html>
