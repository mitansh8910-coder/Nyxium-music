<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nyxium Music</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1a0033, #000000);
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      text-shadow: 0 0 20px #a64dff, 0 0 40px #ff66cc;
    }

    button {
      background: linear-gradient(90deg, #a64dff, #ff66cc);
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px #a64dff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #ff66cc;
    }

    /* Starfield effect */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: moveStars 60s linear infinite;
      z-index: -1;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: 10000px 10000px; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <h1>🌌 Nyxium Music</h1>
  <a href="/login">
    <button>Login with Spotify</button>
  </a>
</body>
</html>
